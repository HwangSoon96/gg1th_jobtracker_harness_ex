<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>새 지원 등록 - JobTracker</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --danger-bg: rgba(255, 59, 48, 0.08);
      --danger-text: #d70015;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: #1c1c1e;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f5f5f7;
        --text-secondary: #98989d;
        --accent: #0a84ff;
        --accent-hover: #3a9bff;
        --danger-bg: rgba(255, 69, 58, 0.14);
        --danger-text: #ff6961;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 3rem 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 520px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    .back-link:hover { text-decoration: underline; }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 1.5rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 1.75rem;
    }

    .errors {
      background: var(--danger-bg);
      color: var(--danger-text);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
    }

    .errors ul {
      margin: 0;
      padding-left: 1.1rem;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field:last-of-type { margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }

    input, select, textarea {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem 0.75rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.18);
    }

    .actions {
      margin-top: 1.75rem;
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      border: none;
      border-radius: 980px;
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="page">
    <a class="back-link" href="/">&larr; 목록으로</a>
    <h1>새 지원 등록</h1>

    <div class="card">
      {% if errors %}
      <div class="errors">
        <ul>
          {% for error in errors %}
          <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}

      <form method="post" action="/new">
        <div class="field">
          <label for="company_name">회사명</label>
          <input type="text" id="company_name" name="company_name" value="{{ form_data.get('company_name', '') }}">
        </div>

        <div class="field">
          <label for="position">직무</label>
          <input type="text" id="position" name="position" value="{{ form_data.get('position', '') }}">
        </div>

        <div class="field">
          <label for="applied_date">지원일</label>
          <input type="date" id="applied_date" name="applied_date" value="{{ form_data.get('applied_date', '') }}">
        </div>

        <div class="field">
          <label for="status">상태</label>
          <select id="status" name="status">
            {% for code, label in status_labels.items() %}
            <option value="{{ code }}" {% if code == form_data.get('status') %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field">
          <label for="notes">메모</label>
          <textarea id="notes" name="notes">{{ form_data.get('notes', '') }}</textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
