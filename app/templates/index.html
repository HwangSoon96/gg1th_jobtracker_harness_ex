<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>지원 현황 목록 - JobTracker</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    form.status-form { display: flex; gap: 0.5rem; }
    .top-bar { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="/new"><button type="button">새 지원 등록</button></a>
  </div>
  <h1>지원 현황 목록</h1>
  <table>
    <thead>
      <tr>
        <th>회사명</th>
        <th>직무</th>
        <th>지원일</th>
        <th>상태</th>
        <th>메모</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for application in applications %}
      <tr>
        <td>{{ application.company_name }}</td>
        <td>{{ application.position }}</td>
        <td>{{ application.applied_date }}</td>
        <td>{{ status_labels.get(application.status, application.status) }}</td>
        <td>{{ application.notes or "" }}</td>
        <td>
          <form class="status-form" method="post" action="/applications/{{ application.id }}/status">
            <select name="status">
              {% for code, label in status_labels.items() %}
              <option value="{{ code }}" {% if code == application.status %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
            <button type="submit">변경</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
